server:
  port: 8085

spring:
  application:
    name: notification-service
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: ${JWT_SECRET:studyscrum-jwt-secret-key-development-only-change-in-production-min-256-bits}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: false
    hostname: localhost
    nonSecurePort: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
