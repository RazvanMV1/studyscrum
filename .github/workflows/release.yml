# =============================================================================
# StudyScrum — Release Pipeline
# Faza 15: GitHub Actions
#
# Declanșat la:
#   - push de tag cu format v* (ex: v1.0.0, v1.2.3)
#
# Pași:
#   1. Build + teste Maven
#   2. Build imagini Docker cu tag de versiune
#   3. Push imagini pe ghcr.io cu tag versiune + latest
#   4. Creare GitHub Release automat
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/studyscrum

jobs:
  # ===========================================================================
  # JOB 1: Build + teste
  # ===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build + teste servicii Java
        run: |
          for service in eureka-server api-gateway identity-service project-service notification-service; do
            if [ -s "${service}/pom.xml" ]; then
              echo "Building ${service}..."
              cd ${service}
              mvn clean verify -B -Xmx512m
              cd ..
            else
              echo "Skipping ${service} (pom.xml gol)"
            fi
          done

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_GATEWAY_URL: http://localhost/api
          VITE_NOTIFICATION_WS_URL: ws://localhost/ws

  # ===========================================================================
  # JOB 2: Build + Push imagini cu tag versiune
  # ===========================================================================
  release-images:
    name: Release Images — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka-server
            context: ./eureka-server
          - service: api-gateway
            context: ./api-gateway
          - service: identity-service
            context: ./identity-service
          - service: project-service
            context: ./project-service
          - service: notification-service
            context: ./notification-service
          - service: frontend
            context: ./frontend
            build-args: |
              VITE_API_GATEWAY_URL=http://localhost/api
              VITE_NOTIFICATION_WS_URL=ws://localhost/ws

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Verificare Dockerfile
        id: check
        run: |
          [ -f "${{ matrix.context }}/Dockerfile" ] && echo "skip=false" >> $GITHUB_OUTPUT || echo "skip=true" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrage metadata
        if: steps.check.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build + Push imagine
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # JOB 3: Creare GitHub Release
  # ===========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: release-images
    permissions:
      contents: write

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Creare Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## StudyScrum ${{ github.ref_name }}

            ### Imagini Docker disponibile pe ghcr.io:
            - `ghcr.io/${{ github.repository_owner }}/studyscrum-eureka-server:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/studyscrum-api-gateway:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/studyscrum-identity-service:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/studyscrum-project-service:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/studyscrum-notification-service:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/studyscrum-frontend:${{ github.ref_name }}`
