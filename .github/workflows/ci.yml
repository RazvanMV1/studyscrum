# =============================================================================
# StudyScrum — CI Pipeline
# Faza 15: GitHub Actions
#
# Declanșat la:
#   - push pe main
#   - orice Pull Request spre main
#
# Pași:
#   1. Build + teste Maven pentru fiecare serviciu Java
#   2. Build imagini Docker
#   3. Push imagini pe ghcr.io (doar pe main, nu pe PR)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/studyscrum

jobs:
  build-java:
    name: Build & Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-server
          - api-gateway
          - identity-service
          - project-service
          - notification-service
          - sprint-service
          - ticket-service

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Verificare pom.xml
        id: check-pom
        run: |
          if [ ! -s "${{ matrix.service }}/pom.xml" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build + teste Maven
        if: steps.check-pom.outputs.skip == 'false'
        working-directory: ${{ matrix.service }}
        run: mvn clean verify -B
        env:
          MAVEN_OPTS: "-Xmx512m"

      - name: Upload raport teste
        if: steps.check-pom.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  build-frontend:
    name: Build & Test — frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalare dependențe
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_GATEWAY_URL: "http://34.116.171.134.nip.io/api"
          VITE_NOTIFICATION_WS_URL: "ws://34.116.171.134.nip.io/ws"

  docker:
    name: Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build-java, build-frontend]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka-server
            context: ./eureka-server
          - service: api-gateway
            context: ./api-gateway
          - service: identity-service
            context: ./identity-service
          - service: project-service
            context: ./project-service
          - service: notification-service
            context: ./notification-service
          - service: frontend
            context: ./frontend
          - service: sprint-service
            context: ./sprint-service
          - service: ticket-service
            context: ./ticket-service
            build-args: |
              VITE_API_GATEWAY_URL=http://34.116.171.134.nip.io/api
              VITE_NOTIFICATION_WS_URL=ws://34.116.171.134.nip.io/ws

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Verificare context Docker
        id: check-context
        run: |
          if [ ! -f "${{ matrix.context }}/Dockerfile" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Docker Buildx
        if: steps.check-context.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        if: steps.check-context.outputs.skip == 'false' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrage metadata imagine
        if: steps.check-context.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build imagine Docker
        if: steps.check-context.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max