server:
  port: 8081

spring:
  application:
    name: identity-service
  data:
    mongodb:
      uri: mongodb://studyscrum:studyscrum123@localhost:27017/studyscrum_identity?authSource=admin
      database: studyscrum_identity
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
