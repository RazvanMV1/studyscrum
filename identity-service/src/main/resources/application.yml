server:
  port: 8081

spring:
  application:
    name: identity-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://studyscrum:studyscrum123@mongodb:27017/studyscrum_identity?authSource=admin}
      database: studyscrum_identity
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost/login/oauth2/code/google}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: false
    hostname: localhost
    nonSecurePort: 8081
