# ── secrets.yaml ─────────────────────────────────────────────────────────────
# ATENȚIE: Nu comite acest fișier cu valori reale în Git!
# Înainte de apply, completează valorile de mai jos cu base64:
#   echo -n "valoarea_ta" | base64
#
# Sau folosește scripts/create-secrets.sh care le generează automat.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: studyscrum-secrets
  namespace: studyscrum
type: Opaque
stringData:
  # MongoDB
  mongodb-root-username: studyscrum
  mongodb-root-password: studyscrum123

  # Redis (fără parolă în dev — string gol)
  redis-password: ""

  # JWT — generează cu: openssl rand -hex 64
  jwt-secret: "INLOCUIESTE_CU_UN_SECRET_LUNG_MINIM_64_CHARS"

  # Google OAuth2 — din Google Cloud Console
  google-client-id: "INLOCUIESTE_CU_GOOGLE_CLIENT_ID"
  google-client-secret: "INLOCUIESTE_CU_GOOGLE_CLIENT_SECRET"
