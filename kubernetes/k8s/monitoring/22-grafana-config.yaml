# ── Datasource Prometheus ─────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: studyscrum
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
# ── Dashboard provider ────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: studyscrum
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: studyscrum
        orgId: 1
        folder: StudyScrum
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
