server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service-oauth2
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/login/**,/oauth2/**
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/auth/**
            - id: project-service
              uri: lb://project-service
              predicates:
                - Path=/projects/**
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_URL:http://localhost:5173}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

jwt:
  secret: ${JWT_SECRET:studyscrum-jwt-secret-key-development-only-change-in-production-min-256-bits}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    preferIpAddress: false
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
